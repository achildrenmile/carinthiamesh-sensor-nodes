name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # MeshCore-Stand, gegen den gebaut und simuliert wird
  MESHCORE_REF: 81dbae5

jobs:
  simulation:
    name: Simulation (PC, ohne Hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MeshCore holen
        run: |
          git clone https://github.com/meshcore-dev/MeshCore.git ../MeshCore
          git -C ../MeshCore checkout "$MESHCORE_REF"
      - name: Bibliotheken laden (Crypto, CayenneLPP)
        run: |
          pip install platformio
          cd ../MeshCore && pio pkg install -e Heltec_v3_sensor
      - name: Simulation ausfuehren
        run: make -C sim test MESHCORE="$PWD/../MeshCore"

  build:
    name: Firmware kompiliert (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Heltec_v3_sensor, RAK_4631_sensor, Xiao_nrf52_sensor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.target }}-${{ env.MESHCORE_REF }}
      - name: MeshCore holen
        run: |
          git clone https://github.com/meshcore-dev/MeshCore.git ../MeshCore
          git -C ../MeshCore checkout "$MESHCORE_REF"
      - run: pip install platformio
      - name: Alle Beispiele bauen
        run: scripts/build_examples.sh ../MeshCore ${{ matrix.target }}
