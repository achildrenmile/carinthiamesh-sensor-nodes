<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">MeshCore Button-Sensor – Schaltplan (Heltec V3)</text>

  <!-- Heltec box -->
  <rect x="40" y="60" width="170" height="410" rx="8" fill="#f3f6fa" stroke="#334" stroke-width="2"/>
  <text x="125" y="88" text-anchor="middle" font-weight="bold" fill="#223">Heltec V3</text>
  <text x="125" y="106" text-anchor="middle" font-size="12" fill="#556">ESP32-S3 + SX1262</text>

  <g fill="#223" font-size="13">
    <text x="196" y="144" text-anchor="end">GPIO 4</text>
    <text x="196" y="204" text-anchor="end">GPIO 5</text>
    <text x="196" y="264" text-anchor="end">GPIO 6</text>
    <text x="196" y="324" text-anchor="end">GPIO 7</text>
    <text x="196" y="384" text-anchor="end">GPIO 41</text>
    <text x="196" y="434" text-anchor="end">GPIO 42</text>
    <text x="196" y="464" text-anchor="end">GND</text>
  </g>

  <!-- GND bus -->
  <line x1="680" y1="120" x2="680" y2="460" stroke="#111" stroke-width="2.5"/>
  <line x1="210" y1="460" x2="680" y2="460" stroke="#111" stroke-width="2.5"/>
  <text x="690" y="300" font-size="13" fill="#111" transform="rotate(90 690 300)">GND</text>
  <!-- ground symbol -->
  <line x1="660" y1="482" x2="700" y2="482" stroke="#111" stroke-width="2"/>
  <line x1="667" y1="489" x2="693" y2="489" stroke="#111" stroke-width="2"/>
  <line x1="674" y1="496" x2="686" y2="496" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="460" x2="680" y2="482" stroke="#111" stroke-width="2"/>

  <!-- Buttons: y = 140, 200, 260, 320 -->
  <g stroke="#111" stroke-width="2" fill="none">
    <!-- T1 -->
    <line x1="210" y1="140" x2="400" y2="140"/>
    <circle cx="404" cy="140" r="4" fill="#fff"/>
    <line x1="408" y1="140" x2="452" y2="124"/>
    <circle cx="460" cy="140" r="4" fill="#fff"/>
    <line x1="430" y1="118" x2="430" y2="108"/><line x1="418" y1="108" x2="442" y2="108"/>
    <line x1="464" y1="140" x2="680" y2="140"/>
    <!-- T2 -->
    <line x1="210" y1="200" x2="400" y2="200"/>
    <circle cx="404" cy="200" r="4" fill="#fff"/>
    <line x1="408" y1="200" x2="452" y2="184"/>
    <circle cx="460" cy="200" r="4" fill="#fff"/>
    <line x1="430" y1="178" x2="430" y2="168"/><line x1="418" y1="168" x2="442" y2="168"/>
    <line x1="464" y1="200" x2="680" y2="200"/>
    <!-- T3 -->
    <line x1="210" y1="260" x2="400" y2="260"/>
    <circle cx="404" cy="260" r="4" fill="#fff"/>
    <line x1="408" y1="260" x2="452" y2="244"/>
    <circle cx="460" cy="260" r="4" fill="#fff"/>
    <line x1="430" y1="238" x2="430" y2="228"/><line x1="418" y1="228" x2="442" y2="228"/>
    <line x1="464" y1="260" x2="680" y2="260"/>
    <!-- T4 -->
    <line x1="210" y1="320" x2="400" y2="320"/>
    <circle cx="404" cy="320" r="4" fill="#fff"/>
    <line x1="408" y1="320" x2="452" y2="304"/>
    <circle cx="460" cy="320" r="4" fill="#fff"/>
    <line x1="430" y1="298" x2="430" y2="288"/><line x1="418" y1="288" x2="442" y2="288"/>
    <line x1="464" y1="320" x2="680" y2="320"/>
  </g>
  <g font-size="13" fill="#223">
    <text x="432" y="160" text-anchor="middle">Taster 1</text>
    <text x="432" y="220" text-anchor="middle">Taster 2</text>
    <text x="432" y="280" text-anchor="middle">Taster 3</text>
    <text x="432" y="340" text-anchor="middle">Taster 4</text>
  </g>
  <!-- pull-up note -->
  <text x="300" y="132" text-anchor="middle" font-size="11" fill="#667">interner Pull-up</text>

  <!-- LED path y=380 -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="210" y1="380" x2="300" y2="380"/>
    <rect x="300" y="372" width="60" height="16" fill="#fff"/>
    <line x1="360" y1="380" x2="420" y2="380"/>
    <!-- LED diode -->
    <polygon points="420,366 420,394 448,380" fill="#fff"/>
    <line x1="448" y1="366" x2="448" y2="394"/>
    <line x1="448" y1="380" x2="680" y2="380"/>
    <line x1="436" y1="362" x2="448" y2="350"/><line x1="444" y1="364" x2="456" y2="352"/>
  </g>
  <text x="330" y="406" text-anchor="middle" font-size="13" fill="#223">220–330 Ω</text>
  <text x="434" y="412" text-anchor="middle" font-size="13" fill="#223">LED</text>
  <text x="560" y="372" text-anchor="middle" font-size="11" fill="#667">Kathode (kurzes Bein)</text>

  <!-- Buzzer y=430 -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="210" y1="430" x2="410" y2="430"/>
    <rect x="410" y="418" width="44" height="24" rx="4" fill="#fff"/>
    <line x1="454" y1="430" x2="680" y2="430"/>
  </g>
  <text x="432" y="435" text-anchor="middle" font-size="11" fill="#223">BZ</text>
  <text x="400" y="424" text-anchor="end" font-size="13" fill="#223">+</text>
  <text x="560" y="450" text-anchor="middle" font-size="11" fill="#667">aktiver Buzzer 3,3 V</text>

  <text x="380" y="512" text-anchor="middle" font-size="11" fill="#667">Antenne (868 MHz) immer vor dem Einschalten anstecken · kein Kabel auf 3V3/5V/VBAT nötig</text>
</svg>
