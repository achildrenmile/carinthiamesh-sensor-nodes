; Sensor-Target fuer Seeed XIAO nRF52840 mit Wio-SX1262.
; Upstream (MeshCore) hat dafuer keins. An variants/xiao_nrf52/platformio.ini anhaengen,
; dann: pio run -e Xiao_nrf52_sensor -t upload
;
; Belegte Pins: D1-D5 Funkmodul, D6/D7 I2C (SCL/SDA).
; Frei: D0, D8, D9, D10. Pins der Beispiele per Build-Flag unten ergaenzen.

[env:Xiao_nrf52_sensor]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
; --- Pins der Beispiele (je nach Beispiel einkommentieren) ---
; door-sensor:    -D DOOR_PIN=D0
; leak-sensor:    -D LEAK_PIN=D0
; button-sensor:  -D BTN1_PIN=D0 -D BTN2_PIN=D8 -D BTN3_PIN=D9 -D BTN4_PIN=D10 -D LED_PIN=D6 -D BUZZER_PIN=D7
; climate-sensor: keine Pins noetig, BME280 an D6 (SCL) und D7 (SDA)
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_sensor>
